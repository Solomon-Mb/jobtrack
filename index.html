<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>JobTrack</h1>
        <p>Track your job and internship applications</p>
    </header>

    <main>

        <section class="stats">
            <div class="card">
                <h2>0</h2>
                <p>Total Applications</p>
            </div>

            <div class="card">
                <h2>0</h2>
                <p>Applied</p>
            </div>

            <div class="card">
                <h2>0</h2>
                <p>Interviews</p>
            </div>

            <div class="card">
                <h2>0</h2>
                <p>Accepted</p>
            </div>
        </section>

        <section class="applications">
            <h2>My Applications</h2>

            <button id="addApplication">
                + Add Application
            </button>

            <p>No applications yet.</p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
