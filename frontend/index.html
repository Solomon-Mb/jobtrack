<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>JobTrack</h1>
        <p>Track your job and internship applications</p>
                <div id="userBar" class="user-bar hidden">
            <span>Signed in as <strong id="userName"></strong></span>
            <button id="logoutBtn" type="button">Log out</button>
        </div>
    </header>
        <section id="authSection" class="auth-section hidden">
        <h2 id="authTitle">Log in</h2>
        <p id="authError" class="auth-error hidden"></p>

        <form id="loginForm">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required>

            <button type="submit">Log in</button>
        </form>

        <form id="registerForm" class="hidden">
            <label for="registerName">Name</label>
            <input type="text" id="registerName" required>

            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" required>

            <label for="registerPassword">Password (at least 8 characters)</label>
            <input type="password" id="registerPassword" required minlength="8">

            <button type="submit">Create account</button>
        </form>

        <p><a href="#" id="authSwitch">Need an account? Register</a></p>
    </section>

    <main id="appSection" class="hidden">
    <section class="stats">
        <div class="card">
            <h3>Total Applications</h3>
            <p id="totalApplications">0</p>
        </div>

        <div class="card">
            <h3>Applied</h3>
            <p id="appliedApplications">0</p>
        </div>

        <div class="card">
            <h3>Interviews</h3>
            <p id="interviewApplications">0</p>
        </div>

        <div class="card">
            <h3>Offers</h3>
            <p id="offerApplications">0</p>
        </div>
                <div class="card">
            <h3>Rejected</h3>
            <p id="rejectedApplications">0</p>
        </div>
    </section>

    <section class="applications">
        <div class="section-header">
            <h2>My Applications</h2>
            <div class="filters">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by company or position"
    >

    <select id="statusFilter">
        <option value="all">All Statuses</option>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
    </select>

    <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="company">Company A-Z</option>
    </select>
</div>
            <button id="addApplicationBtn">Add Application</button>
        </div>

        <div id="applicationForm" class="form-container hidden">
            <h3>Add Job Application</h3>

            <form id="jobForm">
                <label for="company">Company</label>
                <input type="text" id="company" required>

                <label for="position">Position</label>
                <input type="text" id="position" required>

                <label for="status">Status</label>
                <select id="status">
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>

                <label for="date">Application Date</label>
                <input type="date" id="date" required>
                <label for="interviewDate">Interview Date (optional)</label>
<input type="date" id="interviewDate">

<label for="companyWebsite">Company Website (optional)</label>
<input type="text" id="companyWebsite" placeholder="https://example.com">

<label for="companyLocation">Company Location (optional)</label>
<input type="text" id="companyLocation">

<label for="notes">Notes (optional)</label>
<textarea id="notes" rows="4"></textarea>

                <button type="submit">Save Application</button>
            </form>
        </div>
        <div id="detailsOverlay" class="overlay hidden">
    <div id="detailsPanel" class="form-container">
        <h3>Application Details</h3>
        <div id="detailsContent"></div>
        <button id="closeDetailsBtn">Close</button>
    </div>
</div>

        <div id="applicationsList">
            <p>No applications yet.</p>
        </div>
    </section>
</main>

        <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
